[package]
name = "http-compare-servers"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "toxi-server"
path = "src/bin/toxi_server.rs"

[[bin]]
name = "rocket-server"
path = "src/bin/rocket_server.rs"

[[bin]]
name = "poem-server"
path = "src/bin/poem_server.rs"

[[bin]]
name = "salvo-server"
path = "src/bin/salvo_server.rs"

[[bin]]
name = "warp-server"
path = "src/bin/warp_server.rs"

[[bin]]
name = "loco-server"
path = "src/bin/loco_server.rs"

[dependencies]
toxi = { path = "../../toxi/toxi", default-features = false }
tokio = { version = "1", features = ["full"] }
axum = "0.8"
rocket = { version = "0.5", features = ["json"] }
poem = "3"
salvo = "1"
warp = { version = "0.4", features = ["server"] }
loco-rs = { version = "1", default-features = false, features = ["cli"] }
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
